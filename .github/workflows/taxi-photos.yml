name: Taxi photos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Зависимости (rembg / U2-Net)
        run: pip install "rembg[cpu]" pillow numpy
      - name: Избор на кадър + боядисване (жълто / зелено за EV и хибриди)
        run: python3 scripts/paint_taxis.py
      - name: Commit
        run: |
          git config user.name ci; git config user.email ci@taxiti
          git add img/cars
          git diff --cached --quiet && echo 'нищо за commit' && exit 0
          git commit -m "pilot: снимките на моделите като таксита — жълти, EV/хибриди зелени [skip ci]"
          for i in 1 2 3; do git fetch origin main && git rebase origin/main && git push && break; sleep 3; done
